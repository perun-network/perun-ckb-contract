[package]
name = "perun-common"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ckb-std = "0.16.4"
blake2b-rs = "0.2.0"
ckb-types = { version = "=0.108.0", optional = true }
ckb-gen-types = { version = "0.119.0", default-features = false, optional = true }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "sha256", "arithmetic"]}
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
buddy-alloc = { version = "0.6.0", optional = true }
ckb-occupied-capacity = { version = "0.121.0", optional = true }

[dev-dependencies]
ckb-testtool = "0.14.1"
ckb-std = "0.16.4"
ckb-gen-types = "0.119.0"

[dependencies.molecule]
version = "0.8.0"
default-features = false
features = ["bytes_vec"]

[features]
default = ["contract"]
testing = ["std", "ckb-types", "ckb-occupied-capacity"]
std = []
contract = ["ckb-gen-types"]
