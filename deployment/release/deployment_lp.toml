[[cells]]
name = "lpts"
enable_type_id = true
location = { file = "build/release/liquidity-pool-typescript" }

[[cells]]
name = "lpls"
enable_type_id = true
location = { file = "build/release/liquidity-pool-lockscript" }

# Deployer lock so the deployed cells stay unlockable (upgrades, capacity
# recovery). The secp256k1 code hash is the same on every CKB network; the args
# placeholder is rewritten by deploy_lp.sh to the deployer's lock arg.
[lock]
code_hash = "0x9bd7e06f3ecf4be0f2fcd2188b23f1b9fcc88e5d4b65a8637b17723bbda3cce8"
args = "0x0000000000000000000000000000000000000000"
hash_type = "type"
